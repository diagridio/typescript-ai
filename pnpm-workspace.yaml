packages:
  - packages/*

# Keep the dependency surface honest: an adapter package must not silently
# hoist another framework's SDK into its own resolution. Strict, isolated
# linking is pnpm's default — pinned explicitly so a future `.npmrc` tweak
# cannot quietly relax the isolation that
# `tests/guards/cross-framework-imports.test.ts` asserts.
nodeLinker: isolated

# pnpm blocks install scripts unless they are named here. Both entries below
# are required, and both are narrow:
#   esbuild     downloads the platform-native binary tsup compiles with.
#   protobufjs  generates its own descriptor bundle; @grpc/grpc-js (via
#               @dapr/dapr) fails to load protos without it.
# Anything else stays blocked — a new dependency wanting a lifecycle script
# should have to justify itself in review.
allowBuilds:
  esbuild: true
  protobufjs: true
