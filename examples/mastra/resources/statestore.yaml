# Dapr components for the Mastra examples, running locally under `dapr run`.
#
# These deliberately mirror the components a Catalyst project provisions with
# `diagrid project create --deploy-managed-kv --enable-managed-workflow`, down to
# the names, so switching between the two run paths needs no configuration change:
#
#   workflows-state  state store for the Dapr workflow engine (actor state store)
#   kvstore          state store for conversation memory / checkpoints
#
# Both names are fixed on the Catalyst side, not chosen here: `kvstore` is
# `DefaultKVStoreName` and `workflows-state` is `DefaultWorkflowStoreName` in the
# control plane. On Catalyst these are managed (`state.diagrid`) and already
# exist — that path ignores this directory entirely and needs no
# `--resources-path`.
#
# Two components rather than one because Dapr permits only a single actor state
# store, and `kvstore` is not it: the workflow engine claims that role via
# `workflows-state`, while `DaprMastraCheckpointer` does plain key/value work
# against `kvstore` (which is `DEFAULT_STORE_NAME` in
# `packages/core/src/state/store.ts`, so nothing needs configuring).
#
# Redis on localhost:6379 is what `dapr init` gives you. Swap in your own state
# store for anything real.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: workflows-state
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "localhost:6379"
    - name: redisPassword
      value: ""
    # The workflow engine is built on actors, so exactly one component in the
    # project must carry this flag.
    - name: actorStateStore
      value: "true"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kvstore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "localhost:6379"
    - name: redisPassword
      value: ""
