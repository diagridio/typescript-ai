name: Provision n8n types
description: >-
  Builds real n8n-core/n8n-workflow/@n8n/db/@n8n/di types from the commit
  pinned in packages/n8n/n8n-ci-ref.txt and symlinks them into
  packages/n8n/node_modules, so `pnpm typecheck` / `pnpm build` resolve real
  n8n types with no sibling n8n checkout of your own. Every workflow that
  runs `pnpm build` needs this first — see
  packages/n8n/scripts/ci-n8n-types.sh for what it actually does and why.

inputs:
  node-version:
    description: >-
      Node version this job runs under. Part of the cache key: n8n's own
      install compiles a handful of native modules, which are ABI-specific
      per Node version (and OS, already covered by runner.os).
    required: true

runs:
  using: composite
  steps:
    # Keyed on the pinned ref's content, not a hand-bumped version number —
    # editing n8n-ci-ref.txt is what invalidates this, nothing else has to.
    - name: Cache n8n type-checkout
      id: n8n-cache
      uses: actions/cache@v6.1.0
      with:
        path: .n8n-ci-checkout
        key: n8n-ci-types-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('packages/n8n/n8n-ci-ref.txt') }}

    # Idempotent regardless of cache-hit: the script checks for the built
    # dist output itself and skips straight to the symlink step if it is
    # already there, so this is cheap on a hit and does the full
    # fetch/install/build only on a miss.
    - name: Provision real n8n types for @diagrid/n8n
      shell: bash
      run: packages/n8n/scripts/ci-n8n-types.sh
