name: Dependency Conflict Check

# The fast, preventive layer for dependency drift, mirroring
# python-ai's deps-check.yaml. A Dependabot bump that would break adapter
# isolation or the OpenTelemetry contract fails here in ~2 minutes instead of
# surfacing 20 minutes later as a flake in the Ollama e2e lane.

on:
  # No branch filter, deliberately. This used to list `main`, `feature/*` and
  # `release-*` — but this repo's branches are named `feat/`, so every pull
  # request into the stack matched nothing and ran no checks at all. #4 and #5
  # both merged with zero CI, silently, and nothing in the PR UI said so.
  #
  # An enumerated list of target branches has to be kept in step with a naming
  # convention nobody wrote down. Running on every pull request cannot drift.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-check:
    runs-on: ${{ matrix.os }}
    # 15 was enough before Provision n8n types existed; a cache miss there
    # (a fresh cache scope, or a packages/n8n/n8n-ci-ref.txt bump) adds a
    # real n8n fetch + scoped install + build on top of everything else.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: windows-latest, node: "24" }

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The equivalent of `uv lock --check`: --frozen-lockfile fails when
      # pnpm-lock.yaml does not satisfy the manifests.
      - name: Verify pnpm-lock.yaml is in sync
        run: pnpm install --frozen-lockfile

      # Belt-and-braces: catches a lockfile that installs cleanly but would be
      # rewritten by a resolution pass (e.g. a manifest range widened without
      # re-locking).
      - name: Verify the lockfile is not stale
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code pnpm-lock.yaml

      # @diagrid/n8n's peers aren't real installs here (see
      # packages/n8n/package.json's own "//peerDependenciesMeta" note) —
      # without this, Build packages fails on `Cannot find module 'n8n-core'`.
      - name: Provision n8n types
        uses: ./.github/actions/provision-n8n-types
        with:
          node-version: ${{ matrix.node }}

      # The isolation guard inspects the built bundles for inlined
      # dependencies, so the build has to happen first.
      - name: Build packages
        run: pnpm build

      - name: Cross-framework isolation check
        run: pnpm vitest run --project unit tests/guards/cross-framework-imports.test.ts

      - name: Telemetry / OTEL compat check
        run: pnpm vitest run --project unit tests/guards/telemetry-compat.test.ts

      # Documented API surface, held to the same bar as the examples. A quickstart
      # that no longer compiles is a support burden nothing else detects: the
      # examples pass every field, so the type checker never sees the shorter call
      # the docs advertise. Covers README fences and the JSDoc examples that ship
      # inside `dist/index.d.ts` as editor hover text.
      # Loads the real artifacts, and resolves them by package name so the
      # `exports` map runs its actual algorithm. Everything else in the repo runs
      # from source via tsconfig `paths`, so without this a packaging regression
      # reaches consumers before it reaches a test.
      - name: Built packages load and resolve
        run: pnpm vitest run --project unit tests/guards/dist-smoke.test.ts

      - name: Documented snippets compile
        run: pnpm vitest run --project unit tests/guards/readme-snippets.test.ts
