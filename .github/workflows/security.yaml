name: Security Scanning

# Two layers, mirroring python-ai's security.yaml:
#
#   audit   dependency vulnerabilities (`pnpm audit`) — the SCA layer that
#           matters most for a package with a large transitive AI/gRPC tree.
#   codeql  static analysis. CodeQL *is* the SAST engine for TypeScript here —
#           it is the direct counterpart of Bandit in the Python repo, which has
#           no equivalent in the JS ecosystem worth running alongside it.

on:
  # Every pull request, not just those into main — a dependency audit that only
  # runs at the final merge tells you about a problem introduced several PRs ago.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly on Monday at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only production dependencies: a dev-only advisory (in a linter, a test
      # runner) does not ship to a consumer and must not block a release. The
      # weekly cron is what catches those, via the separate step below.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Advisory: reports dev-tree findings without failing the build, so they
      # are visible in the log without turning every upstream advisory in a
      # build tool into a merge blocker.
      - name: Audit dev dependencies (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level high

  codeql:
    # Code scanning needs GitHub Code Security, which a private repository only
    # has with Advanced Security. Without it the analysis runs to completion and
    # then dies on upload — "Code Security must be enabled for this repository
    # to use code scanning", reported as a *configuration error* rather than a
    # finding. That is a permanently red job that says nothing about the code, so
    # it is gated on visibility instead of failing every run.
    #
    # This activates by itself when the repository goes public; nothing to
    # remember. Until then `audit` below still covers dependency CVEs, and the
    # `security-and-quality` pack is a static analysis gap, not a test gap.
    #
    # `== false` rather than `!`: on events whose payload carries no repository
    # object the expression is null, and skipping is the safe direction — a
    # missing payload must not be read as "public".
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Required by codeql-action on a private repository: after exporting SARIF
      # it calls the workflow-runs API to attach the analysis to the run, and
      # without this the job fails with "Resource not accessible by integration"
      # even though the analysis itself succeeded.
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: javascript-typescript
          # `security-and-quality` over the default `security` pack: this is a
          # library other teams embed, so correctness findings are worth the
          # extra runtime.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
